<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Just One Question ❤️</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

        <!--The Boots-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
          
        <link rel="stylesheet" href="style.css">

    </head>
    
    <body>
          <header class="top-bar d-flex align-items-center justify-content-center delius-swash-caps-regular">
            <h2>Valentine Plans</h2>
          </header>

          <!--Functionality Area-->
          <main class="d-flex justify-content-center align-items-center flex-grow-1">
            <div id="play-area" class="play-area position-relative">

                <div class="card main-card text-center">
                <div class="card-body d-flex flex-column align-items-center">

                    <h2 id="card-title" class="mb-4">
                    Will you be my Valentine?
                    </h2>

                    <img
                    id="placeholder-img"
                    src="img/misskalem-penguin-9299275.svg"
                    class="placeholder-img mb-4"
                    alt="placeholder"
                    >

                    <!--Result GIF-->
                    <img
                    id="result-gif"
                    src="img/dudu-bubu.gif"
                    class="result-gif d-none mb-4"
                    alt="result"
                    >

                    <!--Buttons-->
                    <div id="buttons" class="d-flex justify-content-between mb-3">
                    <button id="yes-btn" class="btn yes-btn">
                        Yes 💕
                    </button>

                    <button id="no-btn" class="btn no-btn">
                        No
                    </button>
                    </div>

                </div>
                </div>

            </div>
         </main>

       <footer class="bottom-bar d-flex align-items-center justify-content-center">
            <h4 class="ms-2 delius-swash-caps-regular">Made for Kidi by Lefteris with </h4>
            <img src="img/suit-heart-fill.svg" height="24">
        </footer>

    <script src="script.js"></script>
    </body>
</html>
